# 灵枢 CI：发布一致性 + 隐私单测（零依赖，纯标准库，无需装包）
# 触发：push 到 main / 任何 PR
name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 版本硬检查：SKILL.md / package.json / 插件 metadata.yaml 次版本一致
      - name: check_version
        run: python scripts/check_version.py

      # 根 manifest 覆盖面自检：磁盘文件 vs 清单双向比对
      - name: manifest --check
        run: python scripts/make_manifest.py --check

      # 引擎副本同步检查：scripts/ vs engine/（CRLF 归一化）
      - name: sync --check
        run: python scripts/sync_engine.py --check

      # 插件 checksum 自检
      - name: checksums --check
        run: python scripts/astrbot_plugin_lingshu/make_checksums.py --check

      # 语法全量编译检查（含 tests/）
      - name: py_compile
        run: python -m compileall -q scripts tests

      # 隐私与功能单测：逐个直接运行（纯标准库，无 pytest 依赖）
      # 隔离 HOME：BRAIN_MEMORY_HOME/LINGSHU_GLOBAL_SKILLS 指向临时目录，不碰真实记忆库
      # 失败时把「哪一条测试挂了」直接打成 annotation（公开仓库可不带 token 读 annotations，
      # 而日志接口要鉴权——不然只能看到一句 "Process completed with exit code 1"）。
      - name: tests
        env:
          BRAIN_MEMORY_HOME: ${{ runner.temp }}/ls-ci-home
          LINGSHU_GLOBAL_SKILLS: ${{ runner.temp }}/ls-ci-skills
        shell: bash
        run: |
          set -e
          mkdir -p "$BRAIN_MEMORY_HOME" "$LINGSHU_GLOBAL_SKILLS"
          echo "python: $(python -V 2>&1) · $(uname -a)"
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            out="$(mktemp)"
            if python "$t" >"$out" 2>&1; then
              tail -n 1 "$out" || true
            else
              cat "$out"
              echo "::error file=$t,title=测试文件失败::$(basename "$t") 在 CI（$(uname -s)）上失败；本地绿不等于 CI 绿"
              # 测试脚本的约定输出：`FAIL test_x: 原因` / `ERROR test_x: 异常` / `✗ test_x: …`
              grep -E '^[[:space:]]*(FAIL|ERROR|✗)' "$out" | head -n 20 | while IFS= read -r line; do
                echo "::error file=$t::$(printf '%s' "$line" | tr -d '\r')"
              done
              fail=1
            fi
            rm -f "$out"
            echo "::endgroup::"
          done
          exit $fail

      # 健康自检：隔离 HOME 全新初始化，doctor 应零 fail（warn 允许）
      - name: doctor
        env:
          BRAIN_MEMORY_HOME: ${{ runner.temp }}/ls-ci-doctor
        run: |
          mkdir -p "$BRAIN_MEMORY_HOME"
          python scripts/brain.py doctor --json
          python scripts/brain.py doctor --json >/dev/null; rc=$?
          if [ "$rc" -eq 2 ]; then exit 1; else exit 0; fi
