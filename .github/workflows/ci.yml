# 灵枢 CI：发布一致性 + 隐私单测（零依赖，纯标准库，无需装包）
# 触发：push 到 main / 任何 PR
name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  consistency:
    # v3.66（已知问题 #2）：双平台跑。灵枢是 Windows 优先工具（CRLF/PowerShell/
    # danger-guard/备份选址），以前只在 ubuntu 跑，Windows 本地绿不代表可发布——
    # v3.45 清单过期、v3.47/v3.48 测试平台假设都是这么漏过去的。矩阵让两边都验。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # P1-1：engine/ 是 scripts/+docs/ 的派生副本，已从 git 移除（见 .gitignore）。
      # 必须在所有一致性检查前先生成，否则 sync/checksums 都会报"副本缺失"。
      # 这一步等价于本地的 make_plugin_zip.py 打包前同步，保证 CI 校验的是同一份产物。
      - name: 生成 engine 副本
        run: python scripts/sync_engine.py

      # 版本硬检查：SKILL.md / package.json / 插件 metadata.yaml 次版本一致
      - name: check_version
        run: python scripts/check_version.py

      # 根 manifest 覆盖面自检：磁盘文件 vs 清单双向比对
      - name: manifest --check
        run: python scripts/make_manifest.py --check

      # 引擎副本同步检查：scripts/ vs engine/（CRLF 归一化）
      - name: sync --check
        run: python scripts/sync_engine.py --check

      # 水位阈值双份默认值一致性（P6 #28）
      - name: pressure sync
        run: python scripts/check_pressure_sync.py

      # 插件 checksum 自检
      - name: checksums --check
        run: python scripts/astrbot_plugin_lingshu/make_checksums.py --check

      # 语法全量编译检查（含 tests/）
      - name: py_compile
        run: python -m compileall -q scripts tests

      # 隐私与功能单测：逐个直接运行（纯标准库，无 pytest 依赖）
      # 隔离 HOME：BRAIN_MEMORY_HOME/LINGSHU_GLOBAL_SKILLS 指向临时目录，不碰真实记忆库
      # 失败时把「哪一条测试挂了」直接打成 annotation（公开仓库可不带 token 读 annotations，
      # 而日志接口要鉴权——不然只能看到一句 "Process completed with exit code 1"）。
      - name: tests
        # 注意：这里**不给**整段 loop 设 BRAIN_MEMORY_HOME——每个测试文件在循环里
        # 各自建独立临时 HOME。共用一份会让前面的测试污染后面的（实测
        # test_context_ab.py 跑完，test_inject_lazy.py 的预算用例必挂、单跑必过）。
        # 与 scripts/run_tests.py 的约定保持一致：「每个测试文件独立临时 HOME」。
        env:
          LS_CI_ROOT: ${{ runner.temp }}
        shell: bash
        run: |
          set -e
          echo "python: $(python -V 2>&1) · $(uname -a)"
          fail=0
          i=0
          for t in tests/test_*.py; do
            i=$((i + 1))
            echo "::group::$t"
            out="$(mktemp)"
            # 每个测试文件独立 HOME / 技能目录，互不污染
            export BRAIN_MEMORY_HOME="$LS_CI_ROOT/ls-ci-home-$i"
            export LINGSHU_GLOBAL_SKILLS="$LS_CI_ROOT/ls-ci-skills-$i"
            rm -rf "$BRAIN_MEMORY_HOME" "$LINGSHU_GLOBAL_SKILLS"
            mkdir -p "$BRAIN_MEMORY_HOME" "$LINGSHU_GLOBAL_SKILLS"
            if python "$t" >"$out" 2>&1; then
              tail -n 1 "$out" || true
            else
              cat "$out"
              echo "::error file=$t,title=测试文件失败::$(basename "$t") 在 CI（$(uname -s)）上失败；本地绿不等于 CI 绿"
              # 测试脚本的约定输出：`FAIL test_x: 原因` / `ERROR test_x: 异常` / `✗ test_x: …`
              grep -E '^[[:space:]]*(FAIL|ERROR|✗)' "$out" | head -n 20 | while IFS= read -r line; do
                echo "::error file=$t::$(printf '%s' "$line" | tr -d '\r')"
              done
              fail=1
            fi
            rm -f "$out"
            echo "::endgroup::"
          done
          exit $fail

      # 健康自检：隔离 HOME 全新初始化，doctor 应零 fail（warn 允许）
      - name: doctor
        env:
          BRAIN_MEMORY_HOME: ${{ runner.temp }}/ls-ci-doctor
        shell: bash   # v3.66：Windows runner 默认是 pwsh，下面的 mkdir -p/$? 需要 bash
        run: |
          mkdir -p "$BRAIN_MEMORY_HOME"
          python scripts/brain.py doctor --json
          python scripts/brain.py doctor --json >/dev/null; rc=$?
          if [ "$rc" -eq 2 ]; then exit 1; else exit 0; fi
